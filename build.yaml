# Builds the Avalanche firmware on GitHub Actions.
#
# The left half is the central (it talks to the computer), so ZMK Studio is
# built into the left half only: connect it over USB and open https://zmk.studio.
# Unlock key: hold Fn (&mo 1) and press the outermost key of the left home row
# (the one that is Esc on the base layer).
---
include:
  - board: nice_nano_v2
    shield: avalanche_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: avalanche_left-nice_nano_v2-zmk
  - board: nice_nano_v2
    shield: avalanche_right
  - board: nice_nano_v2
    shield: settings_reset
